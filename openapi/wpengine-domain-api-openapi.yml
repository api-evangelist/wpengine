      address:
        type: array
        description: The addresses of the domain
        items:
          type: string
        example:
        - 192.0.2.10
        - 192.0.2.11
      aname:
        type: array
        description: The A name records of the domain
        items:
          type: object
          properties:
            hdr:
              type: object
              description: Header of the start of authority record
            a:
              type: string
              description: The A name record
      ssl:
