    x-nullable: true
    description: Path to the next page of results
  DomainStatus:
    type: object
    properties:
      name:
        type: string
        description: The domain name
      cname:
        type: string
        description: The CNAME of the domain
      a_record:
        type: string
        description: The A record of the domain
      aaaa_record:
        type: string
        description: The AAAA record of the domain
